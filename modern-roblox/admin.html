  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans Pro', Arial, Helvetica, sans-serif; background: #f2f2f2; color: #191919; font-size: 14px; }
    .admin-wrap { max-width: 1100px; margin: 26px auto; padding: 0 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(25, 25, 25, 0.2); padding: 20px; }
    .card .num { font-size: 34px; font-weight: 700; color: #0074BD; }
    .card .label { color: #666; font-size: 14px; margin-top: 2px; }
    h2 { font-size: 18px; font-weight: 600; color: #343434; margin: 0 0 12px; }
    .panel { background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(25, 25, 25, 0.2); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 16px; text-align: left; font-size: 14px; border-bottom: 1px solid #ebebeb; }
    th { background: #f7f7f7; color: #666; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; background: #00A2FF; color: #fff; border-radius: 10px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .muted { color: #999; }
    .verified { width: 14px; height: 14px; vertical-align: middle; margin-left: 4px; }
  </style>
</head>
<body class="rbx-body">
  <div id="wrap" class="wrap no-gutter-ads logged-in">
    <div id="navigation-container"></div>
    <div id="container-main" class="container-main" tabindex="-1">
      <div class="content">
        <div class="admin-wrap">
          <div class="cards">
            <div class="card"><div class="num" id="s-users">&ndash;</div><div class="label">Total Users</div></div>
            <div class="card"><div class="num" id="s-sessions">&ndash;</div><div class="label">Active Sessions</div></div>
            <div class="card"><div class="num" id="s-verified">&ndash;</div><div class="label">Verified Users</div></div>
          </div>
          <h2>Recent Users</h2>
          <div class="panel">
            <table>
              <thead><tr><th>ID</th><th>Username</th><th>Gender</th><th>Status</th></tr></thead>
              <tbody id="t-users"><tr><td colspan="4" class="muted" style="text-align:center">Loading&hellip;</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    fetch('/admin-api/stats')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        document.getElementById('s-users').textContent = d.users;
        document.getElementById('s-sessions').textContent = d.sessions;
        document.getElementById('s-verified').textContent = d.verified;
        var tb = document.getElementById('t-users');
        if (!d.recent || !d.recent.length) { tb.innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center">No users yet</td></tr>'; return; }
        tb.innerHTML = d.recent.map(function (u) {
          var gender = u.gender == 2 ? 'Male' : u.gender == 3 ? 'Female' : '&mdash;';
          return '<tr><td>' + u.id + '</td><td>' + u.username + '<img src="/verified.svg" class="verified" alt="" /></td><td>' + gender + '</td><td><span class="badge">Verified</span></td></tr>';
        }).join('');
      })
      .catch(function () {
        document.getElementById('s-users').textContent = '&mdash;';
        document.getElementById('s-sessions').textContent = '&mdash;';
        document.getElementById('s-verified').textContent = '&mdash;';
        document.getElementById('t-users').innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center">Admin access required</td></tr>';
      });
  </script>
</body>
</html>
